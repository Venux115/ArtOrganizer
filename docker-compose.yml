services:
  app:
    build:
      context: .
      target: runtime
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:?Defina DB_NAME no arquivo .env}
      DB_USER: ${DB_USER:?Defina DB_USER no arquivo .env}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/public/upload
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 8000) ? 0 : 1);'"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  db:
    image: mariadb:11.4.5
    environment:
      MARIADB_DATABASE: ${DB_NAME:?Defina DB_NAME no arquivo .env}
      MARIADB_USER: ${DB_USER:?Defina DB_USER no arquivo .env}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Defina DB_ROOT_PASSWORD no arquivo .env}
    volumes:
      - db_data:/var/lib/mysql
      - ./artorganizer.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u\"$${MARIADB_USER}\" -p\"$${MARIADB_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  db_data:
  uploads:
